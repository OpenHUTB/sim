name: 编译本科论文（可复用）
on:
  workflow_call:

jobs:
  build-thesis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 编译 HUTB 毕业论文
        uses: xu-cheng/latex-action@v3
        with:
          root_file: phys/undergraduate/hutbthesis_main.tex
          working_directory: phys/undergraduate
          compiler: xelatex
          latexmk_use_xelatex: true
          args: "-shell-escape"

      - name: 上传生成的PDF
        uses: actions/upload-artifact@v4
        with:
          name: hutb-thesis-pdf
          path: phys/undergraduate/hutbthesis_main.pdf

