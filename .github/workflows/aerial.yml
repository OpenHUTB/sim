name: Build Aerial Thesis
on:
  push:
    paths:
      - 'aerial/undergraduate/**'
      - '.github/workflows/aerial.yml'
  pull_request:
    paths:
      - 'aerial/undergraduate/**'
      - '.github/workflows/aerial.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile LaTeX Thesis
        uses: xu-cheng/latex-action@v3
        with:
          root_file: aerial/undergraduate/hutbthesis_main.tex
          compiler: xelatex
          args: "-shell-escape"
      - name: Compile LaTeX Thesis
  uses: xu-cheng/latex-action@v3
  with:
    root_file: aerial/undergraduate/hutbthesis_main.tex
    compiler: xelatex
    args: "-shell-escape"


      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: aerial-thesis-pdf
          path: aerial/undergraduate/*.pdf
