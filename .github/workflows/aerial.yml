name: Build Aerial Thesis
on:
  push:
    paths:
      - 'aerial/undergraduate/**'
      - '.github/workflows/aerial.yml'
  pull_request:
    paths:
      - 'aerial/undergraduate/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: CI‑only runtime patch（仅虚拟机内存修改，仓库源码完全不变）
        run: |
          cd aerial/undergraduate
          # 修复Windows换行符CRLF
          sed -i 's/\r$//' hutbthesis.cls
          sed -i 's/\r$//' hutbthesis_main.tex
          # 英文衬线：Times New Roman → TeX Gyre Termes
          sed -i 's/Times New Roman/TeX Gyre Termes/g' hutbthesis.cls
          # 英文无衬线：Arial → Liberation Sans
          sed -i 's/Arial/Liberation Sans/g' hutbthesis.cls
          # 中文黑体：SimHei → Noto Sans CJK SC
          sed -i 's/SimHei/Noto Sans CJK SC/g' hutbthesis.cls
          # 微软雅黑：Microsoft YaHei → Noto Sans CJK SC
          sed -i 's/Microsoft YaHei/Noto Sans CJK SC/g' hutbthesis.cls
          # 中文宋体：SimSun → Noto Serif CJK SC
          sed -i 's/SimSun/Noto Serif CJK SC/g' hutbthesis.cls

      - name: Compile LaTeX Thesis
        uses: xu-cheng/latex-action@v3
        with:
          root_file: aerial/undergraduate/hutbthesis_main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          args: "-shell-escape"

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: aerial-thesis-pdf
          path: aerial/undergraduate/*.pdf
