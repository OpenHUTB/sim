name: Build Aerial Thesis
on:
  push:
    paths:
      - 'aerial/undergraduate/**'
      - '.github/workflows/aerial.yml'
  pull_request:
    paths:
      - 'aerial/undergraduate/**'
      - '.github/workflows/aerial.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix line endings (CRLF → LF)
        run: |
          cd aerial/undergraduate
          sed -i 's/\r$//' hutbthesis.cls
          sed -i 's/\r$//' hutbthesis_main.tex

      - name: Compile LaTeX Thesis
        uses: xu-cheng/latex-action@v3
        with:
          root_file: aerial/undergraduate/hutbthesis_main.tex
          latexmk_use_xelatex: true
          args: "-shell-escape"
          pre_compile: |
            cd aerial/undergraduate
            sed -i 's/SimSun/FandolSong/g' hutbthesis.cls
            sed -i 's/SimHei/FandolHei/g' hutbthesis.cls
            sed -i 's/KaiTi/FandolKai/g' hutbthesis.cls
            sed -i 's/FangSong/FandolFang/g' hutbthesis.cls

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: aerial-thesis-pdf
          path: aerial/undergraduate/*.pdf
