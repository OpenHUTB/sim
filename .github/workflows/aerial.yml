name: Build Aerial Thesis
on:
  push:
    paths:
      - 'aerial/undergraduate/**'
      - '.github/workflows/aerial.yml'
  pull_request:
    paths:
      - 'aerial/undergraduate/**'
      - '.github/workflows/aerial.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix line endings & CI临时替换fontset（仅CI虚拟机内部生效，不改动仓库源码）
        run: |
          cd aerial/undergraduate
          sed -i 's/\r$//' hutbthesis.cls
          sed -i 's/\r$//' hutbthesis_main.tex
          sed -i 's/fontset=windows/fontset=fandol/g' hutbthesis_main.tex

      - name: Compile LaTeX Thesis
        uses: xu-cheng/latex-action@v3
        with:
          root_file: aerial/undergraduate/hutbthesis_main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          args: "-shell-escape"

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: aerial-thesis-pdf
          path: aerial/undergraduate/*.pdf
